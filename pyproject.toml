[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bwpi"
version = "0.1.0"
description = "Run pi inside a bubblewrap sandbox"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Roberto Porpora"}
]

[project.scripts]
bwpi = "bwpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
